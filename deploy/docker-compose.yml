# Стенд на ВМ: три контейнера, наружу смотрит только nginx-край (без пароля).
#   edge (nginx, :EDGE_PORT) → api (ASP.NET Core + фронт, :8080) → core (Python, :8000)
# Образы собираются локально и доставляются на ВМ скриптом deploy.sh; TAG и EDGE_PORT
# приезжают в .env рядом с этим файлом.

services:
  core:
    image: domeo-spec-core:${TAG:-latest}
    build:
      context: ../core
    restart: unless-stopped
    environment:
      # Прайс закупки (pricelist.json) и кэш интернет-цен живут в томе — переживают пересборку образа.
      DATA_DIR: /data
    # Ключи (ANTHROPIC_API_KEY для поиска цен в интернете) — в secrets.env рядом с compose на ВМ;
    # файла может не быть, тогда поиск в интернете просто выключен. deploy.sh его не трогает.
    env_file:
      - path: secrets.env
        required: false
    volumes:
      - core_data:/data
    # Разбор 100-страничного тома — до ~500 МБ; ВМ на 4 ГБ делит память с соседями.
    mem_limit: 1200m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: domeo-spec-api:${TAG:-latest}
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Engine__BaseUrl: http://core:8000
      Engine__TimeoutSeconds: "600"
    # ConnectionStrings__Quotations — адрес существующего PostgreSQL, БД и отдельный пользователь.
    env_file:
      - path: database.env
        required: false
    depends_on:
      - core
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8090}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  core_data:
