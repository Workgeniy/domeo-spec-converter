# Край стенда: basic auth, лимиты, проксирование в api. Правила — по плейбуку харднинга края.
worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    error_log     /var/log/nginx/error.log warn;
    sendfile      on;

    # Имена контейнеров резолвим в рантайме: адрес api меняется на каждом выкате.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:10m;

    map $http_user_agent $bad_bot {
        default 0;
        ~*(nikto|sqlmap|feroxbuster|masscan|nmap|zgrab) 1;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 8080;
        server_name _;

        # Том до 100 МБ; разбор большого PDF идёт минуту и больше.
        client_max_body_size 100m;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        if ($bad_bot) { return 403; }
        limit_conn connperip 30;

        # Стенд закрыт паролем целиком: и интерфейс, и API.
        auth_basic           "Domeo Spec Converter";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Проба живости без пароля — для мониторинга и деплоя.
        location = /edge-health {
            auth_basic off;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=perip burst=40 nodelay;
            set $upstream http://api:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
